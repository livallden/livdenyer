{% if path == 'home' %}
<header>
    <nav class="home-nav wrap" aria-label="Main">
        <a href="/" class="home-nav__name">{{settings.name}}</a>
        <div class="home-nav__right">
            <div class="daypicker" role="group" aria-label="Time of day" hidden>
                <button type="button" data-time="morning" aria-pressed="false" title="Morning">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 15.5h16M5.5 15.5a4.5 4.5 0 0 1 9 0M10 5.5v2M4.3 8.8l1.4 1.4M15.7 8.8l-1.4 1.4"/></svg>
                    <span class="sr-only">Morning</span>
                </button>
                <button type="button" data-time="afternoon" aria-pressed="false" title="Afternoon">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M4.7 15.3 6 14M14 6l1.3-1.3"/></svg>
                    <span class="sr-only">Afternoon</span>
                </button>
                <button type="button" data-time="evening" aria-pressed="false" title="Evening">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 15.5h16M6 15.5a4 4 0 0 1 8 0M10 3.5v5M7.8 6.5 10 8.7l2.2-2.2"/></svg>
                    <span class="sr-only">Evening</span>
                </button>
                <button type="button" data-time="night" aria-pressed="false" title="Night">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 12.6A6.2 6.2 0 0 1 7.4 4.5a6.2 6.2 0 1 0 8.1 8.1Z"/></svg>
                    <span class="sr-only">Night</span>
                </button>
            </div>
            <a href="https://linkedin.com/in/odenyer" class="home-nav__link" target="_blank" rel="noopener">LinkedIn</a>
        </div>
    </nav>
</header>
{% else %}
<div class="w-full">
    <nav class="flex items-center justify-center lg:justify-between flex-wrap p-6 lg:px-0 container mx-auto" x-data="{ isOpen: false }" @keydown.escape="isOpen = false"  @click.away="isOpen = false">
        <!--Logo etc-->
        <div class="flex items-center">
            <a href="/" class="font-bold text-lg">
                <span>{{settings.name}}</span></a>
        </div>

        <!--Toggle button (hidden on large screens)-->
        <button @click="isOpen = !isOpen" type="button" class="ml-auto block lg:hidden px-2 text-primary-500 hover:text-primary-500 focus:outline-none focus:text-primary-500" :class="{ 'transition transform-180': isOpen }" aria-label="Menu">
            <svg class="h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 24 24">
                <path x-show="isOpen" fill-rule="evenodd" clip-rule="evenodd" d="M18.278 16.864a1 1 0 0 1-1.414 1.414l-4.829-4.828-4.828 4.828a1 1 0 0 1-1.414-1.414l4.828-4.829-4.828-4.828a1 1 0 0 1 1.414-1.414l4.829 4.828 4.828-4.828a1 1 0 1 1 1.414 1.414l-4.828 4.829 4.828 4.828z"/>
                <path x-show="!isOpen" fill-rule="evenodd" d="M4 5h16a1 1 0 0 1 0 2H4a1 1 0 1 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2z"/>
            </svg>
        </button>

        <!--Menu-->
        <div class="w-full flex-grow lg:flex lg:items-center lg:w-auto text-center " :class="{ 'block shadow-3xl': isOpen, 'hidden': !isOpen }" x-show.transition="true">

            {% if navigation.items %}

                <ul class="pt-6 lg:pt-0 list-reset lg:flex justify-end flex-1 items-center">
                    {% for item in navigation.items %}
                        <li class="nav__item mr-3">
                            <a @click="isOpen = false" class="text-ml inline-block text-gray-500 no-underline hover:text-indigo-500 py-2 px-4" href="{{ item.url }}">{{ item.text }}</a>
                        </li>
                    {% endfor %}
                </ul>

            {% endif %}
        </div>
    </nav>
</div>

{% endif %}
